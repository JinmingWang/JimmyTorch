<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JimmyTorch Training Monitor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="monitor-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">JimmyTorch / live run</p>
        <h1>Training Monitor</h1>
      </div>
      <div class="topbar-actions">
        <span id="connection-state" class="connection-state">Connecting</span>
        <label class="theme-control" for="theme-select">Theme</label>
        <select id="theme-select" aria-label="Color theme">
          <option value="system">System</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
    </header>

    <section class="progress-section" aria-label="Training progress">
      <div class="progress-heading">
        <div>
          <p class="eyebrow">Run completion</p>
          <p id="overall-progress" class="progress-number">Waiting for data</p>
        </div>
        <p id="overall-percent" class="progress-percent">0.0%</p>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="overall-progress-bar" class="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="epoch-progress">Epoch --</span>
      </div>
    </section>

    <section id="metric-cards" class="metric-grid" aria-label="Current metrics"></section>

    <section class="dashboard-grid">
      <article class="chart-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Recent events</p>
            <h2 id="chart-title">Metric history</h2>
          </div>
          <select id="metric-select" aria-label="Metric displayed in chart"></select>
        </div>
        <canvas id="metric-chart" aria-label="Recent metric line chart"></canvas>
        <p id="chart-empty" class="empty-state">Waiting for metric data.</p>
      </article>

      <article class="control-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Runtime control</p>
            <h2>Learning rate</h2>
          </div>
        </div>
        <form id="learning-rate-form" class="learning-rate-form">
          <label for="learning-rate">Set for next batch</label>
          <div class="input-row">
            <input id="learning-rate" name="learning-rate" type="number" min="0" step="any" inputmode="decimal" required>
            <button type="submit">Apply</button>
          </div>
        </form>
        <dl class="learning-rate-status">
          <div><dt>Applied</dt><dd id="applied-learning-rate">--</dd></div>
          <div><dt>Pending</dt><dd id="pending-learning-rate">None</dd></div>
        </dl>
        <p id="learning-rate-message" class="control-message">Changes apply before the next training batch.</p>
      </article>

      <article class="events-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Latest sample</p>
            <h2>Recent activity</h2>
          </div>
        </div>
        <ol id="event-list" class="event-list"></ol>
      </article>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
